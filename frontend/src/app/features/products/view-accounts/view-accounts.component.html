<h3>Registered Accounts</h3>
<table class="accounts-table">
  <thead>
    <tr>
      <th>Type</th>
      <th>Number</th>
      <th>Balance</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let account of accounts()">
      <td>{{ account.type }}</td>
      <td>{{ account.number }}</td>
      <td>{{ account.balance | currency:'USD' }}</td>
      <td>
        <button (click)="deleteAccount(account.number)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
