<h3>Registered Accounts</h3>
<table class="accounts-table">
  <thead>
    <tr>
      <th>Type</th>
      <th>Number</th>
      <th>Balance</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let account of accounts()">
      <td>{{ account.tipo }}</td>
      <td>{{ account.num_cuenta }}</td>
      <td>{{ account.saldo | currency:'USD' }}</td>
      <td>
        <button (click)="deleteAccount(account.id_cuenta)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
