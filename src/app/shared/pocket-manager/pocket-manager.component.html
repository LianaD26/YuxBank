<div class="pocket-manager">
    <form action="collection">
        
        <div class="form-group">
            <label for="pocket-name">Pocket Name:</label>
            <input type="text" id="pocket-name" name="pocket-name" required>
        </div>

        <div class="form-group">
            <label for="pocket-description">Description:</label>
            <textarea id="pocket-description" name="pocket-description" rows="4"></textarea>
        </div>

        <div class="form-group">
            <label for="pocket-value">Value:</label>
            <input type="number" id="pocket-value" name="pocket-value" required>
        </div>
        <button type="submit">Create Pocket</button>    
    </form>
</div>
